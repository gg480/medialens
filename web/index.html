<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme:dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c14">
  <title>MediaLens — 智能媒体管理</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="style" href="css/style.css">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient Background Orbs -->
  <div class="ambient-orb ambient-orb--1"></div>
  <div class="ambient-orb ambient-orb--2"></div>
  <div class="ambient-orb ambient-orb--3"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-relevant="additions"></div>

  <!-- App Layout -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">ML</div>
        <div class="sidebar-brand-text">
          <div class="sidebar-brand-name">MediaLens</div>
          <div class="sidebar-brand-version">v0.1.0 · Sprint 2</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-item-icon">◆</span>
          <span class="nav-item-label">仪表盘</span>
        </button>
        <button class="nav-item" data-view="files">
          <span class="nav-item-icon">📁</span>
          <span class="nav-item-label">文件管理</span>
          <span class="nav-item-badge">4</span>
        </button>
        <button class="nav-item" data-view="matches">
          <span class="nav-item-icon">◎</span>
          <span class="nav-item-label">匹配记录</span>
          <span class="nav-item-badge">2.8k</span>
        </button>
        <button class="nav-item" data-view="config">
          <span class="nav-item-icon">⚙</span>
          <span class="nav-item-label">系统设置</span>
        </button>
        <button class="nav-item" data-view="logs">
          <span class="nav-item-icon">≡</span>
          <span class="nav-item-label">活动日志</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-status">
          <span class="status-dot status-dot--online"></span>
          <span>系统运行中</span>
        </div>
        <div class="sidebar-status" style="padding-top:0">
          <span style="font-size:11px;color:var(--color-text-muted)">
            TMDB 已连接 · LLM 就绪
          </span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <a href="#mainContent" class="skip-link" style="position:absolute;top:-100px;left:8px;z-index:999;background:var(--color-accent);color:#080c14;padding:8px 16px;border-radius:0 0 6px 6px;font-size:14px;font-weight:600;text-decoration:none">跳转到内容</a>
      <header class="main-header">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-icon mobile-menu-btn" id="mobileMenuBtn">☰</button>
          <h1 class="header-title" id="headerTitle">仪表盘</h1>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="App.navigate('files')">+ 扫描文件</button>
          <button class="btn-icon" data-tooltip="通知" onclick="Toast.show('暂无新通知', 'info')">🔔</button>
        </div>
      </header>

      <div class="page-content" id="pageContent">
        <!-- 页面由 JS 动态渲染 -->
        <div style="display:grid;gap:16px;padding:4px 0">
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
            ${[1,2,3,4].map(() => '<div class="skeleton" style="height:120px;border-radius:16px"></div>').join('')}
          </div>
          <div class="skeleton" style="height:200px;border-radius:16px"></div>
          <div class="skeleton" style="height:300px;border-radius:16px"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/views/app-views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
