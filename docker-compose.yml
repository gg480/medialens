# =============================================================================
# MediaLens Docker Compose 配置
# 适配极空间 Z4Pro NAS 环境
#
# 使用方式：
#   1. 复制 .env.docker 为 .env 并填入 TMDB API Key 等配置
#   2. 修改下方的 MEDIA_DIR 环境变量或 volumes 中的媒体路径
#   3. docker-compose up -d
# =============================================================================

services:
  medialens:
    # 方式一：从 Dockerfile 本地构建（适用于开发环境或首次部署）
    build: .

    # 方式二：从 GitHub Packages 拉取预构建镜像（推荐用于 NAS 生产环境）
    # 推送 main 分支或打 tag 后，GitHub Actions 会自动构建镜像
    # 使用方法：注释掉上方 build: .，取消下方 image 的注释
    # 参考：https://github.com/你的用户名/medialens/pkgs/container/medialens
    # image: ghcr.io/你的用户名/medialens:latest

    container_name: medialens

    # -----------------------------------------------------------------------
    # 端口映射
    # 左侧为主机端口，右侧为容器端口
    # 如果 8000 已被占用，修改左侧端口
    # -----------------------------------------------------------------------
    ports:
      - "8000:8000"

    # -----------------------------------------------------------------------
    # 卷映射
    # 路径格式适配极空间 Z4Pro ZFS 存储池路径
    # 如果使用 Windows/macOS，路径需要调整为本地格式
    # -----------------------------------------------------------------------
    volumes:
      # SQLite 数据库和缓存数据持久化
      - ./data:/app/data

      # 用户配置文件（可选）
      # 可将 config.yaml 和 .env 放入此目录
      - ./config:/app/config

      # 媒体库目录映射
      # 极空间 Z4Pro 典型路径格式：
      # /tmp/zfsv3/sata11/13143360616/data/电影 -> /media/movies
      # /tmp/zfsv3/sata11/13143360616/data/qb/downloads -> /media/downloads
      #
      # 请根据实际 NAS 存储池路径修改下方映射
      # 可以使用逗号分隔映射多个目录（Docker Compose 不支持直接逗号分隔，
      # 如需要多个媒体目录映射，请复制下方 - type: bind 块）
      - type: bind
        source: /tmp/zfsv3/sata11/13143360616/data
        target: /media

    # -----------------------------------------------------------------------
    # 环境变量配置
    # 优先从 .env 文件加载，environment 节作为补充覆盖
    # -----------------------------------------------------------------------
    env_file:
      - .env
    environment:
      # 时区
      - TZ=Asia/Shanghai
      # 配置文件路径（挂载到 /app/config 下的 .env）
      - MEDIALENS_ENV_FILE=/app/config/.env

    # -----------------------------------------------------------------------
    # 重启策略
    # -----------------------------------------------------------------------
    restart: unless-stopped

    # -----------------------------------------------------------------------
    # 网络模式：bridge
    # 与 tinyMediaManager 容器使用相同模式
    # 如需与 TMM 通信，可加入同一自定义网络
    # -----------------------------------------------------------------------
    network_mode: bridge

    # -----------------------------------------------------------------------
    # 健康检查
    # 通过 API stats 端点检测服务是否正常运行
    # -----------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
